<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Screen Edge Ring Light</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
    }

    /* We only draw on the edges, leaving the center transparent. */
    .edge {
      position: fixed;
      pointer-events: none; /* Just in case – UI is click-through anyway */
      mix-blend-mode: screen;
    }

    /* Adjust these thickness values to taste */
    #top, #bottom {
      left: 0;
      right: 0;
      height: 14vh;
    }

    #left, #right {
      top: 0;
      bottom: 0;
      width: 10vw;
    }

    /* Warm-ish light color and falloff. */
    #top {
      top: 0;
      background: linear-gradient(
        to bottom,
        rgba(255, 240, 220, 0.95),
        rgba(255, 240, 220, 0.4),
        rgba(0, 0, 0, 0)
      );
    }

    #bottom {
      bottom: 0;
      background: linear-gradient(
        to top,
        rgba(255, 240, 220, 0.85),
        rgba(255, 240, 220, 0.35),
        rgba(0, 0, 0, 0)
      );
    }

    #left {
      left: 0;
      background: linear-gradient(
        to right,
        rgba(255, 240, 220, 0.9),
        rgba(255, 240, 220, 0.4),
        rgba(0, 0, 0, 0)
      );
    }

    #right {
      right: 0;
      background: linear-gradient(
        to left,
        rgba(255, 240, 220, 0.9),
        rgba(255, 240, 220, 0.4),
        rgba(0, 0, 0, 0)
      );
    }

    /* Optional subtle center vignette for smoother falloff */
    #center-soften {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(
        circle at 50% 30%,
        rgba(255, 255, 255, 0.0) 0%,
        rgba(0, 0, 0, 0.15) 70%,
        rgba(0, 0, 0, 0.3) 100%
      );
      mix-blend-mode: multiply;
    }
  </style>
</head>
<body>
  <div id="top" class="edge"></div>
  <div id="bottom" class="edge"></div>
  <div id="left" class="edge"></div>
  <div id="right" class="edge"></div>
  <div id="center-soften"></div>
</body>
</html>
